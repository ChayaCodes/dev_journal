name: Daily journal entry

on:
  schedule:
    # 18:00 UTC = 21:00 Israel (summer) / 20:00 (winter). Cron is always UTC.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4

      - name: Append today's entry
        id: entry
        run: |
          set -euo pipefail
          TODAY="$(date +%Y-%m-%d)"

          if [ ! -f journal.md ]; then
            printf '# Journal\n' > journal.md
          fi

          # Idempotent: the local scheduled task may have already written today.
          if grep -qE "^## ${TODAY}\b" journal.md; then
            echo "Entry for ${TODAY} already exists."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '\n## %s\n\n- (add today'"'"'s notes here)\n' "$TODAY" >> journal.md
          echo "today=${TODAY}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.entry.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Must match an email verified on the GitHub account, otherwise the
          # commit will not show up on the profile contribution graph.
          git config user.name "ChayaCodes"
          git config user.email "chaya41182@gmail.com"

          git add journal.md
          git commit -m "journal: ${{ steps.entry.outputs.today }}"

          # Another run (or the local task) may have pushed since checkout.
          git pull --rebase origin main
          git push origin HEAD:main
